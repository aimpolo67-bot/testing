<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 2 Lesson 4: 年龄 (Niánlíng) - အသက်အရွယ်</title>
    
    <style>
        /* Dark Mode Variables */
        :root {
            --bg-color: #f0f2f5;
            --card-bg: white;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --border: #eee;
            --section-bg: #ecf0f1;
            --nav-bg: white;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-main: #ecf0f1;
            --text-sub: #bdc3c7;
            --border: #444;
            --section-bg: #383838;
            --nav-bg: #2d2d2d;
        }

        body { 
            font-family: sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            display: flex; 
            justify-content: center; 
            padding: 15px; 
            padding-bottom: 80px; 
            margin: 0; 
            transition: background-color 0.3s;
        }

        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .home-icon-btn {
            text-decoration: none;
            background: var(--nav-bg);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-size: 1.8rem;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid #3498db;
        }

        #quiz-container { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 500px; 
            text-align: center; 
            position: relative; 
            overflow: hidden; 
        }

        #progress-wrapper { width: 100%; height: 8px; background: var(--border); border-radius: 4px; margin-bottom: 10px; overflow: hidden; }
        #progress-fill { height: 100%; width: 0%; background: #2ecc71; transition: width 0.3s ease; }
        #streak-display { font-size: 1.2rem; margin-bottom: 5px; min-height: 1.5rem; }
        .level-header { background: #2c3e50; color: white; padding: 10px; border-radius: 10px; margin-bottom: 5px; font-weight: bold; }
        .progress-sub { font-size: 0.85rem; color: var(--text-main); margin-bottom: 15px; background: var(--section-bg); padding: 5px; border-radius: 5px; font-weight: bold; }
        
        .display-area { margin: 15px 0; min-height: 3rem; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        .chinese-display { font-size: 1.8rem; font-weight: bold; line-height: 1.3; }
        .pinyin-display { font-size: 1rem; color: var(--text-sub); font-style: italic; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .scrambled-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 20px; }
        
        button { padding: 12px; border: 2px solid #3498db; background: var(--card-bg); color: var(--text-main); border-radius: 10px; cursor: pointer; font-size: 0.95rem; transition: 0.1s; outline: none; }
        .pinyin-part { border-color: #e67e22; color: #d35400; }
        .btn-correct { background: #2ecc71 !important; color: white !important; border-color: #27ae60 !important; }
        .btn-wrong { background: #e74c3c !important; color: white !important; border-color: #c0392b !important; }
        
        #user-build { font-size: 1.2rem; font-style: italic; margin: 10px 0; min-height: 2.5rem; border: 1px dashed #3498db; padding: 10px; border-radius: 5px; background: var(--section-bg); display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 5px; }
        
        #lvl3-controls { margin-top: 25px; display: flex; justify-content: center; gap: 10px; }
        .next-btn { background: #2ecc71; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; display: none; }
        .menu-btn { background: #3498db; color: white; font-size: 1.1rem; border: none; padding: 15px; border-radius: 10px; font-weight: bold; margin-bottom: 10px; width: 100%; cursor: pointer; }
        
        #summary-screen { display: none; padding: 20px; }
        .stat-circle { width: 100px; height: 100px; border-radius: 50%; border: 5px solid #2ecc71; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; margin: 10px auto; color: #2ecc71; }
        
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-8px); } 100% { transform: translateX(0); } }
        .shake { animation: shake 0.3s ease-in-out; }
    </style>
</head>
<body>

    <div id="quiz-container">
        <div id="menu-screen">
            <h2 style="color: var(--text-main);">Level 2 Lesson 4: 年龄 (Niánlíng)</h2>
            <div id="main-menu">
                <button class="menu-btn" onclick="goToLevel(1)">Shēngcí (生词)</button>
                <button class="menu-btn" onclick="goToLevel(2)">Duìhuà (对话)</button>
                <button class="menu-btn" onclick="goToLevel(3)">Páijùzi (排句子)</button>
            </div>
        </div>

        <div id="game-screen" style="display:none;">
            <div id="progress-wrapper"><div id="progress-fill"></div></div>
            <div id="streak-display"></div>
            <div class="level-header" id="level-tag">--</div>
            <div class="progress-sub" id="progress-info">--</div>
            
            <div id="level-1-2-ui">
                <div class="display-area">
                    <div class="chinese-display" id="cn-q">--</div>
                    <div class="pinyin-display" id="py-q">--</div>
                </div>
            </div>

            <div id="level-3-ui" style="display:none;">
                <div style="color: var(--text-sub); font-size: 1.1rem; margin-bottom: 5px;" id="cn-hint-text"></div>
                <div style="color: var(--text-main); font-size: 1.4rem; font-weight: bold;" id="mm-hint">--</div>
                <div id="user-build"></div>
            </div>

            <div class="options-grid" id="options"></div>
            <div class="scrambled-grid" id="scrambled-words"></div>
            
            <div id="lvl3-controls" style="display:none;">
                <button onclick="undoLast()">Undo</button>
                <button onclick="resetSentence()">Reset</button>
                <button onclick="showHint()">Hint</button>
            </div>

            <div id="feedback" style="margin-top:15px; font-weight:bold; min-height:45px;"></div>
            <button id="next-btn" class="next-btn" onclick="autoNext()">Next Question ➔</button>
            <button style="margin-top:20px; width:100%;" onclick="showMainMenu()">🏠 Back to Menu</button>
        </div>

        <div id="summary-screen">
            <h2 style="color: var(--text-main);">Finished!</h2>
            <div id="star-rating" style="font-size:2rem; color:#f1c40f;"></div>
            <div class="stat-circle" id="accuracy-pct">0%</div>
            <p id="summary-stats"></p>
            <button class="menu-btn" onclick="showMainMenu()">Back to Menu</button>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="home-icon-btn">🏠</a>
    </div>

<script>
    // Theme check
    if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
    }

   const CONFIG = {
    title: "Level 2 Lesson 1: 爱好 (Àihào) - ဝါသနာ",
    vocab: [
        { cn: "爱好", py: "àihào", mm: "ဝါသနာ" }, 
        { cn: "唱歌", py: "chàng gē", mm: "သီချင်းဆိုသည်" },
        { cn: "音乐", py: "yīnyuè", mm: "ဂီတ" }, 
        { cn: "情况", py: "qíngkuàng", mm: "အခြေအနေ" },
        { cn: "洗澡", py: "xǐ zǎo", mm: "ရေချိုးသည်" }, 
        { cn: "放松", py: "fàngsōng", mm: "စိတ်အပန်းပြေစေသည်" },
        { cn: "心情", py: "xīnqíng", mm: "စိတ်ခံစားမှု" }, 
        { cn: "其它", py: "qítā", mm: "အခြား" },
        { cn: "画画", py: "huà huà", mm: "ပန်းချီဆွဲသည်" }, 
        { cn: "知识", py: "zhīshi", mm: "ဗဟုသုတ" },
        { cn: "电视剧", py: "diànshìjù", mm: "တီဗီဇာတ်လမ်းတွဲ" }, 
        { cn: "韩剧", py: "Hánjù", mm: "ကိုရီးယားဇာတ်လမ်းတွဲ" },
        { cn: "运动", py: "yùndòng", mm: "အားကစား" }, 
        { cn: "最近", py: "zuìjìn", mm: "လောလောဆယ်" },
        { cn: "业余", py: "yèyú", mm: "အားလပ်ချိန်" }, 
        { cn: "足球比赛", py: "zúqiú bǐsài", mm: "ဘောလုံးပြိုင်ပွဲ" },
        { cn: "跳舞", py: "tiào wǔ", mm: "ကခုန်သည်" }, 
        { cn: "拜佛", py: "bài fó", mm: "ဘုရားရှိခိုး" },
        { cn: "大金塔", py: "Dàjīntǎ", mm: "ရွှေတိဂုံဘုရား" }, 
        { cn: "聊天", py: "liáo tiān", mm: "စကားပြောသည်" },
        { cn: "逛街", py: "guàng jiē", mm: "ဈေးဝယ်ထွက်သည်" }, 
        { cn: "常常", py: "chángcháng", mm: "မကြာမကြာ" },
        { cn: "网上", py: "wǎngshàng", mm: "အင်တာနက်ပေါ်" }, 
        { cn: "让", py: "ràng", mm: "လုပ်ခိုင်းသည်" },
        { cn: "少", py: "shǎo", mm: "နည်းသည်" }, 
        { cn: "多", py: "duō", mm: "များပြား" },
        { cn: "这样", py: "zhèyàng", mm: "ဒီလို" }, 
        { cn: "才", py: "cái", mm: "မှ" },
        { cn: "进步", py: "jìnbù", mm: "တိုးတက်မှု" }
    ],
    sentences: [
        { 
            cn: "你有什么爱好？", 
            py: "Nǐ yǒu shénme àihào?", 
            mm: "မင်းမှာ ဘာဝါသနာရှိလဲ?", 
            pyParts: [{w:"Nǐ"}, {w:"yǒu"}, {w:"shénme"}, {w:"àihào?"}] 
        },
        { 
            cn: "我的爱好是唱歌和听音乐。", 
            py: "Wǒ de àihào shì chànggē hé tīng yīnyuè.", 
            mm: "ကျွန်တော့်ဝါသနာက သီချင်းဆိုတာနဲ့ သီချင်းနားထောင်တာပါ။", 
            pyParts: [{w:"Wǒ de"}, {w:"àihào shì"}, {w:"chànggē"}, {w:"hé"}, {w:"tīng yīnyuè."}] 
        },
        { 
            cn: "洗澡的时候，我会唱歌。", 
            py: "Xǐ zǎo de shíhou, wǒ huì chàng gē.", 
            mm: "ရေချိုးတဲ့အချိန်မှာ ငါသီချင်းဆိုတယ်။", 
            pyParts: [{w:"Xǐ zǎo"}, {w:"de shíhou,"}, {w:"wǒ huì"}, {w:"chàng gē."}] 
        },
        { 
            cn: "因为听音乐可以放松心情。", 
            py: "Yīnwèi tīng yīnyuè kěyǐ fàngsōng xīnqíng.", 
            mm: "ဘာလို့လဲဆိုတော့ သီချင်းနားထောင်တာက စိတ်အပန်းပြေစေလို့ပါ။", 
            pyParts: [{w:"Yīnwèi"}, {w:"tīng yīnyuè"}, {w:"kěyǐ"}, {w:"fàngsōng"}, {w:"xīnqíng."}] 
        },
        { 
            cn: "我的爱好是看书和看电视剧。", 
            py: "Wǒ de àihào shì kànshū hé kàndiànshìjù.", 
            mm: "ကျွန်တော့်ဝါသနာက စာဖတ်တာနဲ့ တီဗီဇာတ်လမ်းတွဲကြည့်တာပါ။", 
            pyParts: [{w:"Wǒ de"}, {w:"àihào shì"}, {w:"kànshū"}, {w:"hé"}, {w:"kàndiànshìjù."}] 
        },
        { 
            cn: "我在看韩剧。", 
            py: "Wǒ zài kàn Hánjù.", 
            mm: "ကျွန်တော် ကိုရီးယားဇာတ်လမ်းတွဲ ကြည့်နေပါတယ်။", 
            pyParts: [{w:"Wǒ"}, {w:"zài kàn"}, {w:"Hánjù."}] 
        },
        { 
            cn: "明天我要去大金塔拜佛。", 
            py: "Míngtiān wǒ yào qù Dàjīntǎ bàifó.", 
            mm: "မနက်ဖြန် ငါရွှေတိဂုံဘုရားကို ဘုရားဖူးသွားမယ်။", 
            pyParts: [{w:"Míngtiān"}, {w:"wǒ"}, {w:"yào"}, {w:"qù"}, {w:"Dàjīntǎ"}, {w:"bàifó."}] 
        },
        { 
            cn: "周末我们去逛街吧。", 
            py: "Zhōumò wǒmen qù guàngjiē ba.", 
            mm: "ပိတ်ရက်မှာ ငါတို့ ဈေးဝယ်ထွက်ကြစို့။", 
            pyParts: [{w:"Zhōumò"}, {w:"wǒmen"}, {w:"qù"}, {w:"guàngjiē"}, {w:"ba."}] 
        },
        { 
            cn: "医生让我多运动。", 
            py: "Yīshēng ràng wǒ duō yùndòng.", 
            mm: "ဆရာဝန်က ငါ့ကို ကိုယ်လက်လှုပ်ရှား များများလုပ်ခိုင်းတယ်။", 
            pyParts: [{w:"Yīshēng"}, {w:"ràng"}, {w:"wǒ"}, {w:"duō"}, {w:"yùndòng."}] 
        },
        { 
            cn: "我们要好好学习，这样才会有进步。", 
            py: "Wǒmen yào hǎohǎo xuéxí, zhèyàng cái huì yǒu jìnbù.", 
            mm: "ငါတို့ကောင်းကောင်းစာလေ့လာရမယ်၊ ဒီလိုမှပဲတိုးတက်မှုရှိမယ်။", 
            pyParts: [{w:"Wǒmen"}, {w:"yào"}, {w:"hǎohǎo xuéxí,"}, {w:"zhèyàng"}, {w:"cái huì yǒu"}, {w:"jìnbù."}] 
        }
    ]
};
    let currentLevel = 1, pool = [], currentIndex = 0, currentItem = {}, buildResult = [], canClick = true;
    let errorCount = 0, initialPoolSize = 0, startTime = 0;

    function shuffleArray(array) { return array.sort(() => Math.random() - 0.5); }

    function showMainMenu() {
        document.getElementById('menu-screen').style.display = "block";
        document.getElementById('game-screen').style.display = "none";
        document.getElementById('summary-screen').style.display = "none";
    }

    function goToLevel(lvl) {
        currentLevel = lvl; currentIndex = 0; errorCount = 0;
        startTime = Date.now();
        document.getElementById('menu-screen').style.display = "none";
        document.getElementById('game-screen').style.display = "block";
        
        let rawPool = (lvl === 1) ? [...CONFIG.vocab] : [...CONFIG.sentences];
        pool = shuffleArray(rawPool);
        initialPoolSize = pool.length;

        document.getElementById('level-tag').innerText = (lvl === 1) ? "Shēngcí" : (lvl === 2) ? "Duìhuà" : "Páijùzi";
        document.getElementById('lvl3-controls').style.display = (lvl === 3) ? "flex" : "none";
        updateQuestion();
    }

    function updateQuestion() {
        canClick = true;
        document.getElementById('next-btn').style.display = "none";
        document.getElementById('feedback').innerText = "";
        document.getElementById('user-build').innerHTML = "";
        document.getElementById('options').innerHTML = "";
        document.getElementById('scrambled-words').innerHTML = "";
        
        const progressPct = (currentIndex / initialPoolSize) * 100;
        document.getElementById('progress-fill').style.width = progressPct + "%";
        document.getElementById('progress-info').innerText = `Item: ${currentIndex + 1} / ${initialPoolSize}`;
        
        currentItem = pool[currentIndex];

        if (currentLevel < 3) {
            document.getElementById('level-1-2-ui').style.display = "block";
            document.getElementById('level-3-ui').style.display = "none";
            document.getElementById('cn-q').innerText = currentItem.cn;
            document.getElementById('py-q').innerText = currentItem.py;
            renderOptions();
        } else {
            document.getElementById('level-1-2-ui').style.display = "none";
            document.getElementById('level-3-ui').style.display = "block";
            document.getElementById('mm-hint').innerText = currentItem.mm;
            renderScramble();
        }
    }

    function renderOptions() {
        let choices = [currentItem.mm];
        let source = (currentLevel === 1) ? CONFIG.vocab : CONFIG.sentences;
        while(choices.length < 4) {
            let r = source[Math.floor(Math.random()*source.length)].mm;
            if(!choices.includes(r)) choices.push(r);
        }
        shuffleArray(choices).forEach(c => {
            const b = document.createElement('button');
            b.innerText = c;
            b.onclick = () => {
                if(!canClick) return;
                if(c === currentItem.mm) {
                    b.classList.add('btn-correct');
                    canClick = false;
                    document.getElementById('next-btn').style.display = "block";
                } else {
                    b.classList.add('btn-wrong');
                    errorCount++;
                    document.getElementById('quiz-container').classList.add('shake');
                    setTimeout(() => document.getElementById('quiz-container').classList.remove('shake'), 300);
                }
            };
            document.getElementById('options').appendChild(b);
        });
    }

    function renderScramble() {
        buildResult = [];
        let parts = shuffleArray([...currentItem.pyParts]);
        parts.forEach(part => {
            const b = document.createElement('button');
            b.innerText = part.w;
            b.className = "pinyin-part";
            b.onclick = () => {
                if(!canClick || b.disabled) return;
                b.disabled = true;
                buildResult.push(part.w);
                const span = document.createElement('span');
                span.innerText = part.w;
                document.getElementById('user-build').appendChild(span);
                if(buildResult.length === currentItem.pyParts.length) checkSentence();
            };
            document.getElementById('scrambled-words').appendChild(b);
        });
    }

    function checkSentence() {
        if(buildResult.join(" ") === currentItem.pyParts.map(p=>p.w).join(" ")) {
            document.getElementById('feedback').innerText = "Correct! ✓";
            canClick = false;
            document.getElementById('next-btn').style.display = "block";
        } else {
            document.getElementById('feedback').innerText = "Wrong Order!";
            errorCount++;
            setTimeout(resetSentence, 1000);
        }
    }

    function resetSentence() {
        buildResult = [];
        document.getElementById('user-build').innerHTML = "";
        document.querySelectorAll('#scrambled-words button').forEach(b => b.disabled = false);
    }

    function undoLast() {
        const last = buildResult.pop();
        if(!last) return;
        document.getElementById('user-build').lastChild.remove();
        document.querySelectorAll('#scrambled-words button').forEach(b => {
            if(b.innerText === last && b.disabled) { b.disabled = false; return; }
        });
    }

    function showHint() { document.getElementById('cn-hint-text').innerText = currentItem.cn; }

    function autoNext() {
        currentIndex++;
        if(currentIndex < initialPoolSize) updateQuestion();
        else showSummary();
    }

    function showSummary() {
        document.getElementById('game-screen').style.display = "none";
        document.getElementById('summary-screen').style.display = "block";
        const acc = Math.round(((initialPoolSize - errorCount) / initialPoolSize) * 100);
        document.getElementById('accuracy-pct').innerText = (acc < 0 ? 0 : acc) + "%";
    }

    showMainMenu();
</script>
</body>
</html>
